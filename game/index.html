<style>/* game fonts are inside the game (work offline, no outside requests). License: a/fonts-OFL.txt */

/* phones: keep the right-side home buttons a little away from the rounded screen corners */

html.phone #title #dailyBtn,html.phone #title .wallet{translate:calc(var(--sxr) - 16px) calc(var(--oyb) - 6px)}

/* map: the strip left of the first beach shows the same map picture (lined up), and no rubber-band pull past the ends */

<style>
/* Layout: one fixed 1280x720 landscape stage, scaled to fit the screen; screens swap inside it. Single sunny look, no dark mode. */
:root{
  --sea:#0d6f8f; --sea-deep:#06485e; --ink:#4a2a14; --cream:#fff8e8;
  --sun:#ffc531; --leaf:#4cc23f; --leaf-dark:#2a8a25; --coral:#ff6b3d; --wood:#b97a43; --wood-dark:#7a4a24;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS","Noto Sans Myanmar",sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,"Noto Sans Myanmar",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none;background:var(--sea-deep);font-family:var(--body);color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{touch-action:none;overscroll-behavior:none;position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,var(--sea),var(--sea-deep));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#app::before{content:"";position:absolute;inset:-40px;background:var(--fill,none) center/cover;filter:blur(18px) brightness(.85) saturate(1.1);transition:background-image .3s}
#stage{position:absolute;width:1280px;height:720px;left:50%;top:50%;transform-origin:center center;overflow:visible;--oxl:0px;--oxr:0px;--oyt:0px;--oyb:0px;--sxl:0px;--sxr:0px;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.4);background:#7fd3f0}
.screen{position:absolute;inset:0;overflow:visible}
.screen::before{content:"";position:absolute;top:calc(-1*var(--oyt));bottom:calc(-1*var(--oyb));left:calc(-1*var(--oxl));right:calc(-1*var(--oxr));background:inherit;z-index:-1;pointer-events:none}
#app::before{display:none!important}
/* EDGE ANCHORS: on screens wider or taller than the game, buttons hug the real screen edges */
#title .gearbtn,#title .tb1{translate:calc(-1*var(--sxl)) calc(-1*var(--oyt))}
#title #boostBtn,#title #shopBtn{translate:var(--sxr) calc(-1*var(--oyt))}
#title #dailyBtn,#title .wallet{translate:var(--sxr) var(--oyb)}
#title .h-boy,#title .h-girl{translate:calc(-.6*var(--oxl)) var(--oyb)}
#title .logo{translate:0 calc(-.5*var(--oyt))}#title .btnrow,#title .tag{translate:0 calc(.15*var(--oyb))}
#map .head{left:calc(-1*var(--sxl))!important;right:calc(-1*var(--sxr))!important;top:calc(18px - var(--oyt))!important}
#map .maphint{translate:0 var(--oyb)}
#mapScroll{background:url(a/bg_map.webp) left center/auto 100% repeat-x}
#prizes::before{background:radial-gradient(circle at 50% 30%,#fff3cf,#f0d9a6 70%,#d9b97c)!important}
#prizes .phead{left:calc(-1*var(--sxl))!important;right:calc(-1*var(--sxr))!important;top:calc(16px - var(--oyt))!important}
#prizeGrid{left:calc(24px - var(--sxl))!important;right:calc(24px - var(--sxr))!important;top:calc(128px - var(--oyt))!important;bottom:calc(16px - var(--oyb))!important}
#game #hud{left:calc(14px - var(--sxl));right:calc(14px - var(--sxr))}
#game #boosts{translate:none!important} /* FIX: #boosts sits inside #hud, which already hugs the left edge and the top */
#game #tray{left:calc(16px - var(--sxl)*.5)}#game #panel{left:calc(830px + var(--sxr)*.5)}
#stage.port{width:720px;height:1280px}
#stage.port #title .logo{top:200px;scale:.9;transform-origin:50% 0}
#stage.port #title .tag{top:560px;font-size:24px;z-index:5}
#stage.port #title .btnrow{top:650px}
#stage.port #title .hero{bottom:-110px;height:560px}#stage.port #title .h-boy{left:-20px}#stage.port #title .h-girl{left:190px}
#stage.port #title .bg{object-position:40% 50%}
#stage.port #title .btnrow .btn{width:420px;height:104px}
#stage.port #title .tb1,#stage.port #title .gearbtn{top:24px!important}#stage.port #title .tbtn:not(#dailyBtn){top:24px}
#game #hud,#game .awning{translate:0 calc(-1*var(--oyt))}
/* BIG / TALL SCREENS: the extra height below the game (--oyb) is shared out: the ingredient tray and the blend panel
   grow taller (--gy, set in fit()), and the counter scene moves down only by what is left. Nothing is moved twice. */
#game #slots,#game .counter,#game #blender,#game #ready,#game #decor{translate:0 calc(var(--oyb) - 188px*(var(--gy,1) - 1))}
#game #tray,#game #panel{height:calc(188px*var(--gy,1));translate:0 calc(var(--oyb) - 188px*(var(--gy,1) - 1))}
#game #combo{translate:0 calc(var(--oyt) + var(--oyb) - 188px*(var(--gy,1) - 1))}
#game #tray{width:calc(800px + (var(--sxl) + var(--sxr))*.5)} /* wide screens: the tray fills the gap up to the blend panel */
/* where this level takes place: a little wooden beach sign hanging from the awning, above the blender */
@font-face{font-family:"Chalk Sign";src:url(a/chalk-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Chalk Sign";src:url(a/chalk-400.woff2) format("woff2");font-weight:400;font-display:swap}
#beachsign{position:absolute;left:1056px;top:70px;width:240px;aspect-ratio:480/305;z-index:8;pointer-events:none;transform-origin:50% 0;translate:0 calc(-1*var(--oyt));
  background:url(a/sign_chalk.webp) center/100% 100% no-repeat;filter:drop-shadow(0 5px 3px rgba(74,42,20,.3));animation:signDrop .9s cubic-bezier(.3,1.5,.5,1) both,signSway 4.5s 1s ease-in-out infinite}
/* the chalkboard part of the picture: the beach name is written on it in chalk */
#beachsign .plank{position:absolute;left:9%;right:9%;top:33%;bottom:14%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:rotate(-1.5deg)}
#beachsign b{display:block;font-family:"Chalk Sign",var(--display);font-weight:700;font-size:24px;line-height:1;color:rgba(255,255,255,.93);letter-spacing:.3px;text-shadow:0 0 1px rgba(255,255,255,.6),0 0 6px rgba(255,255,255,.18)}
#beachsign small{display:block;margin-top:4px;font-family:"Chalk Sign",var(--body);font-weight:400;font-size:14px;line-height:1.1;color:rgba(255,240,170,.88);text-shadow:0 0 4px rgba(255,240,170,.2)}
#beachsign b.long{font-size:20px}#beachsign:empty{display:none}
@keyframes signDrop{0%{transform:translateY(-140px) rotate(-14deg);opacity:0}60%{transform:translateY(6px) rotate(5deg);opacity:1}80%{transform:rotate(-2.5deg)}100%{transform:rotate(0)}}
@keyframes signSway{0%,100%{transform:rotate(0)}30%{transform:rotate(1.6deg)}70%{transform:rotate(-1.6deg)}}
#game #tray{grid-template-rows:repeat(2,minmax(0,1fr))}#game #tray .ing{min-height:0;overflow:hidden}
#game #tray .ing img,#game #tray.dense .ing img{position:absolute;left:3%;top:3%;width:94%;height:94%;object-fit:contain}
#game #hud>.pill,#game #hud>#pauseBtn{zoom:var(--gz,1)}
#game #panel.row #jar,#game #panel.row .acts{zoom:var(--gz,1)}
#game .counter{bottom:calc(-10px - 2*var(--oyb))!important}
#map::before{background:url(a/bg_map.webp) left center/auto 100% repeat-x}
img{max-width:none;-webkit-user-drag:none;pointer-events:none}
button{font-family:var(--display);cursor:pointer;border:0;color:#fff}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.bg{position:absolute;top:calc(-1*var(--oyt));left:calc(-1*var(--oxl));width:calc(100% + var(--oxl) + var(--oxr));height:calc(100% + var(--oyt) + var(--oyb));object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,72,94,.0) 40%,rgba(6,72,94,.55))}

/* glossy buttons */
.btn{font-size:34px;padding:14px 38px 18px;border-radius:999px;background:linear-gradient(180deg,#8ee65a,var(--leaf) 45%,var(--leaf-dark));
  box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 6px 0 #1d6419,0 10px 18px rgba(0,0,0,.3);text-shadow:0 3px 0 #1d6419;letter-spacing:.5px;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 2px 0 #1d6419}
.btn.orange{background:linear-gradient(180deg,#ffb36b,var(--coral) 50%,#d9471b);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 6px 0 #a3330f,0 10px 18px rgba(0,0,0,.3);text-shadow:0 3px 0 #a3330f}
.btn.blue{background:linear-gradient(180deg,#7fdcff,#2aa6db 50%,#147aa8);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 6px 0 #0d5677,0 10px 18px rgba(0,0,0,.3);text-shadow:0 3px 0 #0d5677}
.btn.small{font-size:24px;padding:10px 26px 13px}
.btn:disabled{filter:grayscale(.9) brightness(.9);cursor:default}
.round{width:64px;height:64px;padding:0;border-radius:50%;background:none;display:grid;place-items:center}
.round img{width:64px;height:64px}

.logo{font-family:var(--display);line-height:.86;text-align:center;letter-spacing:1px}
.logo span{display:block;-webkit-text-stroke:10px var(--ink);paint-order:stroke fill;filter:drop-shadow(0 7px 0 var(--ink))}
.logo .l1{font-size:118px;color:var(--sun)}
.logo .l2{font-size:132px;color:#7be04a}

.pill{display:flex;align-items:center;gap:8px;background:var(--cream);border:4px solid var(--ink);border-radius:999px;padding:2px 18px 2px 4px;font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;box-shadow:0 4px 0 rgba(74,42,20,.35)}
.pill img{width:44px;height:44px}

/* ---------- title ---------- */
.screen .logo{position:absolute;left:0;right:0;top:30px;line-height:.82;white-space:nowrap;transform:rotate(-3deg);z-index:2;animation:logoIn .9s cubic-bezier(.3,1.6,.5,1) both,logoHop 2.2s 1.2s ease-in-out infinite}
@keyframes logoHop{0%,55%,100%{transform:rotate(-3deg) translateY(0) scale(1)}12%{transform:rotate(-3deg) translateY(4px) scale(1.04,.94)}26%{transform:rotate(-1deg) translateY(-26px) scale(.98,1.04)}40%{transform:rotate(-3deg) translateY(0) scale(1.03,.96)}}
@keyframes logoIn{from{transform:rotate(-12deg) scale(.2);opacity:0}}
@keyframes wob{50%{transform:rotate(-1deg) scale(1.03)}}
.screen .logo span{display:block;position:relative;color:transparent;-webkit-text-stroke:16px var(--ink);filter:drop-shadow(0 10px 0 var(--ink)) drop-shadow(0 14px 12px rgba(0,0,0,.35))}
.screen .logo span::after{content:attr(data-t);position:absolute;inset:0;-webkit-text-stroke:0;-webkit-background-clip:text;background-clip:text;color:transparent}
.screen .logo .l1{font-size:134px}
.screen .logo .l1::after{background-image:linear-gradient(180deg,#e9ffb0 0%,#9cf05a 30%,#4cc23f 62%,#23861f 100%)}
.screen .logo .l2{font-size:176px;margin-top:-4px}
.screen .logo .l2::after{background-image:linear-gradient(180deg,#fff7b0 0%,#ffd84a 30%,#ffb21f 62%,#ff7a1a 100%)}
#title .tag{position:absolute;left:50%;top:300px;transform:translateX(-50%);z-index:2;white-space:nowrap;font-family:var(--display);font-size:28px;color:var(--ink);background:var(--cream);border:5px solid var(--ink);border-radius:999px;padding:4px 26px 6px;box-shadow:0 5px 0 rgba(74,42,20,.4)}
#title .pick{position:absolute;left:50%;top:660px;transform:translateX(-50%);white-space:nowrap;font-family:var(--display);font-size:22px;color:#fff;background:rgba(74,42,20,.82);border-radius:999px;padding:3px 18px 5px;pointer-events:none;z-index:2}
#title .stand{position:absolute;left:190px;top:262px;width:900px}
#title .goods{position:absolute;top:470px;display:flex;align-items:flex-end;gap:2px;z-index:1}
#title .goods img{height:110px}
#title .goods img.fb{height:66px;margin-bottom:-6px}
#title .gl{left:262px}#title .gr{left:830px}
#title .hero{position:absolute;bottom:-250px;height:630px;z-index:2;animation:bob 2.6s ease-in-out infinite}
#title .h-boy{left:-30px;z-index:3}
#title .h-girl{left:175px;z-index:2;animation-delay:-1.3s}
#title .h-man{left:-10px;bottom:-225px;animation-delay:-.7s}
#title .h-woman{right:-20px;bottom:-225px;animation-delay:-2s}
#title .hello{display:none!important;position:absolute;left:50%;top:356px;transform:translateX(-50%);z-index:3;font-family:var(--display);font-size:26px;color:var(--ink);background:var(--sun);border:4px solid var(--ink);border-radius:999px;padding:2px 18px 4px;box-shadow:0 4px 0 rgba(74,42,20,.4);white-space:nowrap}
#title .hello:empty{display:none}
.nameform{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:4px}
.nameform input{caret-color:transparent}
.kb{display:flex;flex-direction:column;gap:8px;align-items:center}
.kr{display:flex;gap:8px}
.k{width:80px;height:68px;border-radius:14px;background:#fff;border:3px solid rgba(74,42,20,.35);box-shadow:0 3px 0 rgba(74,42,20,.3);color:var(--ink);font-family:var(--display);font-size:36px;padding:0}
.k.wide{width:130px;background:var(--coral);color:#fff;border-color:var(--ink)}
.k:active{transform:translateY(3px);box-shadow:none}
.nameform input{font-family:var(--display);font-size:34px;text-align:center;width:420px;max-width:100%;padding:8px 16px;border:5px solid var(--ink);border-radius:20px;background:#fff;color:var(--ink);outline:none}
.nameform input:focus{box-shadow:0 0 0 5px var(--sun)}
#title .btnrow{position:absolute;left:0;right:0;top:418px;display:flex;flex-direction:column;justify-content:center;gap:22px;align-items:center;pointer-events:none}
#title .btnrow .btn{pointer-events:auto}
#title .btnrow{z-index:4}
#title #mapBtn{order:-1}
#title .btnrow .btn{width:350px;height:100px;padding:0 0 6px;font-size:42px;display:flex;align-items:center;justify-content:center;gap:10px}
#title .mapbtn img{width:60px;height:60px}
#title .gearbtn{position:absolute;left:20px;top:18px;z-index:3;width:92px;height:92px}
#title .gearbtn img{width:92px;height:92px}
@keyframes bob{50%{transform:translateY(-12px)}}

/* ---------- splash ---------- */
#splash{background:radial-gradient(circle at 50% 42%,#fff3a8 0,#ffd23f 30%,#ff9a1f 70%,#f2711c 100%);cursor:pointer}
#splash .rays{position:absolute;left:50%;top:42%;width:2200px;height:2200px;margin:-1100px 0 0 -1100px;background:repeating-conic-gradient(rgba(255,255,255,.22) 0 10deg,transparent 10deg 22.5deg);animation:spin 40s linear infinite}
#splash .scup{position:absolute;left:50%;top:22px;height:330px;transform:translateX(-50%);z-index:2;filter:drop-shadow(0 12px 0 rgba(74,42,20,.35));animation:cupIn .8s cubic-bezier(.3,1.6,.5,1) both}
#splash .logo{position:absolute;left:0;right:0;top:42px;z-index:3;scale:.95;transform-origin:50% 0}
#splash .sstand{position:absolute;left:50%;bottom:-40px;width:860px;transform:translateX(-50%);z-index:1;filter:drop-shadow(0 10px 0 rgba(74,42,20,.25));animation:standIn .8s .15s cubic-bezier(.3,1.4,.5,1) both}
@keyframes standIn{from{opacity:0;translate:0 200px}}
#splash .sh{position:absolute;z-index:2;filter:drop-shadow(0 10px 0 rgba(74,42,20,.3));animation:shIn .7s cubic-bezier(.3,1.5,.5,1) both,bob 2.6s ease-in-out infinite}
#splash .s-man{left:20px;bottom:-30px;height:520px;animation-delay:.3s,1s}
#splash .s-boy{left:250px;bottom:-20px;height:420px;z-index:3;animation-delay:.45s,1.4s}
#splash .s-woman{right:20px;bottom:-30px;height:520px;animation-delay:.35s,1.2s}
#splash .s-girl{right:240px;bottom:-20px;height:420px;z-index:3;animation-delay:.5s,1.6s}
@keyframes shIn{from{opacity:0;translate:0 300px}}
#splash .tap{position:absolute;left:50%;bottom:30px;z-index:5;transform:translateX(-50%);z-index:4;font-family:var(--display);font-size:46px;color:#fff;background:rgba(74,42,20,.35);border-radius:999px;padding:4px 30px 8px;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;animation:tapPulse 1.2s ease-in-out infinite}
@keyframes cupIn{from{transform:translateX(-50%) translateY(-120px) scale(.4);opacity:0}}
@keyframes tapPulse{50%{transform:translateX(-50%) scale(1.1)}}

/* ---------- languages ---------- */
.langbtn{display:none!important;position:absolute;right:24px;top:20px;z-index:6;font-family:var(--body);font-weight:900;font-size:24px;color:var(--ink);background:var(--cream);border:4px solid var(--ink);border-radius:999px;padding:6px 18px;box-shadow:0 4px 0 rgba(74,42,20,.35)}
.langbtn.inset{position:static}
.langs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.lg{font-family:var(--body);font-weight:900;font-size:26px;color:var(--ink);background:#fff;border:4px solid rgba(74,42,20,.25);border-radius:18px;padding:14px 18px;min-width:150px}
.lg{display:flex;align-items:center;gap:10px;justify-content:flex-start}
.flag{width:42px;height:28px;border-radius:5px;box-shadow:0 0 0 2px rgba(74,42,20,.35);flex:0 0 auto}
.langbtn{display:flex;align-items:center;gap:8px}
.langbtn .flag{width:34px;height:23px}
.lg.on{background:var(--sun);border-color:var(--ink)}
#stage[data-rtl] .card,#stage[data-rtl] #toast,#stage[data-rtl] .lvlup,#stage[data-rtl] .maphint,#stage[data-rtl] .tag,#stage[data-rtl] .hello,#stage[data-rtl] .bubble .nm{direction:rtl}
#stage[data-rtl] .qrules,#stage[data-rtl] .newprize .tx{text-align:right}

/* ---------- new beach unlocked ---------- */
.card.unlockcard{background:radial-gradient(circle at 50% 35%,#fff7cf,#ffd76a 60%,#ffb43a);overflow:hidden;position:relative}
.unl{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:560px}
.unl .burst{position:absolute;left:50%;top:150px;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(rgba(255,255,255,.5) 0 10deg,transparent 10deg 22.5deg);animation:spin 14s linear infinite;pointer-events:none}
.unl>*:not(.burst){position:relative}
.unl .ttl{font-family:var(--display);font-size:56px;color:#fff;-webkit-text-stroke:10px var(--ink);paint-order:stroke fill;animation:unlTitle .7s cubic-bezier(.3,1.7,.5,1) both}
.unl .ucard{width:330px;border:6px solid var(--ink);border-radius:22px;overflow:hidden;box-shadow:0 0 0 7px var(--sun),0 10px 0 rgba(74,42,20,.4);animation:unlCard .9s .2s cubic-bezier(.3,1.6,.5,1) both;position:relative}
.unl .ucard img{display:block;width:100%;height:185px;object-fit:cover}
.unl .unum{position:absolute;left:8px;top:8px;width:46px;height:46px;border-radius:50%;background:var(--coral);border:4px solid var(--ink);color:#fff;font-family:var(--display);font-size:26px;display:grid;place-items:center}
.unl .uname{font-family:var(--display);font-size:38px;line-height:1.05;text-align:center;animation:unlTitle .6s .5s both}
.unl .uname small{display:block;font-size:20px;opacity:.75}
.unl .uname em{display:block;font-style:normal;font-family:var(--body);font-weight:900;font-size:18px;opacity:.7}

}

/* ---------- store with a grown-up check ---------- */
const PRODUCTS=[{id:'noads',name:'No Ads',desc:'Play without any ads, forever',price:'$2.99',ic:'ic_noads',give:()=>{save.noAds=true}},
  {id:'starter',name:'Starter Pack',desc:'5,000 coins + 3 of every power-up',price:'$1.99',ic:'ic_starter',once:true,give:()=>{save.bank+=5000;for(const k in BOOSTS)save.boosts[k]=(save.boosts[k]|0)+3}},

  {id:'coins_l',name:'Treasure of Coins',desc:'25,000 coins + 5 of every power-up',price:'$5.99',ic:'ic_treasure',give:()=>{save.bank+=25000;for(const k in BOOSTS)save.boosts[k]=(save.boosts[k]|0)+5}},
  {id:'pass',name:'Beach Pass',desc:'30 days: double daily prize + 500 coins every day',price:'$4.99',ic:'ic_pass',give:()=>{save.passUntil=Date.now()+30*864e5}}];
// PARENTAL GATE (Apple Kids Category 1.3 / Google Families): a question written in words, answered by typing the number,
// so young children can't pass it by guessing. Every purchase screen and every link out of the game sits behind it.
const NUMW=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
function parentGate(ok,back){const a=11+Math.floor(Math.random()*8),b=2+Math.floor(Math.random()*7),ans=a+b;let v='';
  overlay(`<h2 style="margin:0;padding:0 40px;font-size:42px;white-space:nowrap">Ask a grown-up</h2><p class="sub">For parents: what is <b>${NUMW[a]} plus ${NUMW[b]}</b>?</p>
    <div class="pgv" id="pgv">&nbsp;</div>
    <div class="pgk">${[1,2,3,4,5,6,7,8,9,'del',0,'OK'].map(k=>`<button class="pk2 ${k==='OK'?'ok':k==='del'?'del':''}" data-k="${k}" ${k==='del'?'aria-label="Delete"':''}>${k==='del'?'<svg viewBox="0 0 40 28" width="46" height="32"><path d="M13 3h22a3 3 0 0 1 3 3v16a3 3 0 0 1-3 3H13L2 14z" fill="#fff" stroke="#4a2a14" stroke-width="3" stroke-linejoin="round"/><path d="M19 9l10 10M29 9L19 19" stroke="#e8402a" stroke-width="3.5" stroke-linecap="round"/></svg>':k}</button>`).join('')}</div>
    <div class="btns" style="margin-top:12px"><button class="btn small orange" id="pgb">Back</button></div>`);
  $('#overlay .card').classList.add('pgcard');
  const show=()=>{$('#pgv').innerHTML=v||'&nbsp;'};
  document.querySelectorAll('#overlay .pk2').forEach(b=>b.onclick=()=>{const k=b.dataset.k;sfx.pop();
    if(k==='del')v=v.slice(0,-1);else if(k==='OK'){if(+v===ans)ok();else{sfx.wrong();back()}return}else if(v.length<3)v+=k;show()});
  $('#pgb').onclick=()=>{sfx.pop();back()}}

  toast('Payments open in the app version');after()}

    <div class="btns" style="margin-top:8px;align-items:center"><button class="privlink" id="restoreB">Restore purchases</button></div>

  $('#restoreB').onclick=()=>{sfx.pop();restorePurchases()};
  $('#overlay .card').classList.add('shopcard','storecard');$('#stx').onclick=()=>{sfx.pop();closeOv()};
  document.querySelectorAll('#overlay [data-p]').forEach(b=>b.onclick=()=>{if(mapDragged)return;sfx.pop();const p=PRODUCTS.find(x=>x.id===b.dataset.p);buyProduct(p,openStoreIn)})}

/* ================= LOADING SCREEN: the shake fills up while the game gets its pictures ready ================= */
(function(){const L=$('#loader');if(!L)return;const t0=performance.now();let done=0,shown=0;
  const list=['aw_main','aw_'+(save.stand||'main'),'lcup_empty','lcup_full','drops','bg_load','bg_splash','bg_map','u_coin','u_star','u_trophy','cup_rainbow','blend_empty','blend_full','blend_run',BEACHES[0].bg,heroId()+'_stand',heroId()+'_mix',heroId()+'_cheer']
    .concat(ALLING.map(i=>'i_'+i)).concat(Object.keys(ATLAS)).concat(Object.keys(CSTRIP).map(w=>'cs_'+w));
  const total=list.length;
  const DR=[["dr_red", 64], ["dr_orange", 64], ["dr_yellow", 64], ["dr_green", 64], ["dr_blue", 64], ["dr_purple", 64], ["dr_spark", 89], ["dr_star", 93]],DT=DR.reduce((a,b)=>a+b[1],0);let lastDrop=0;
  const drop=()=>{const k=Math.floor(Math.random()*DR.length),w=DR[k][1];let x=0;for(let i=0;i<k;i++)x+=DR[i][1];
    const d=document.createElement('div');d.className='drop';const cr=L.querySelector('.lcup').getBoundingClientRect();d.style.cssText=`left:${cr.left+cr.width*(.3+Math.random()*.4)}px;top:${cr.top+cr.height*(.3+Math.random()*.4)}px;width:${w*.5}px;height:45px;background:url(a/drops.webp) -${x*.5}px 0/${DT*.5}px 45px no-repeat;--dx:${(Math.random()<.5?-1:1)*(140+Math.random()*180)}px;--dy:${-80-Math.random()*200}px;--r:${Math.random()*90-45}deg`;
    L.appendChild(d);setTimeout(()=>d.remove(),1300)};
  const set=f=>{$('#lfull').style.height=Math.round(f*100)+'%';if(f<1&&performance.now()-lastDrop>160){lastDrop=performance.now();drop()}
    $('#lfill').style.width=Math.round(f*100)+'%';$('#ltxt').textContent=(f>=1?'Ready!':'Blending… '+Math.round(f*100)+'%')};
  // loading done: the bar gives way to a pulsing TAP TO PLAY; the game (and its music) starts on that tap
  const finish=()=>{set(1);setTimeout(()=>{L.classList.add('ready');$('#ltxt').textContent='TAP TO PLAY';
    let gone=false;const go=()=>{if(gone)return;gone=true;try{audio();sfx.pop()}catch(e){}L.classList.add('out');setTimeout(()=>L.remove(),550);setTimeout(welcome,700)};
    L.addEventListener('pointerdown',go);addEventListener('keydown',function k(e){if(e.key==='Enter'||e.key===' '){removeEventListener('keydown',k);go()}})},400)};
  const tick=()=>{const want=done/total,timeF=Math.min(1,(performance.now()-t0)/1800);shown=Math.min(want,timeF,shown+.04);set(shown);
    if(done>=total&&timeF>=1)return finish();requestAnimationFrame(tick)};
  for(const n of list){const im=new Image();const ok=()=>{done++};im.onload=ok;im.onerror=ok;im.src='a/'+n+'.webp'}
  setTimeout(()=>{done=total},9000); // never get stuck on a slow connection
  requestAnimationFrame(tick)})();

})();
